name: MacShot

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Tek ad sabiti: ürün adı, bundle id ve kayıt klasörü buradan türetilir.
    APP_NAME: MacShot
    BUNDLE_ID_PREFIX: com.mucahitimre
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 4SFTG4T5YD
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0

targets:
  MacShotCore:
    type: framework
    platform: macOS
    sources: [Sources/MacShotCore]
    settings:
      base:
        PRODUCT_NAME: MacShotCore
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower).core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  MacShot:
    type: application
    platform: macOS
    sources: [Sources/MacShot]
    dependencies:
      - target: MacShotCore
      - package: KeyboardShortcuts
    info:
      path: Sources/MacShot/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: Sources/MacShot/MacShot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.pictures.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower)
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  MacShotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MacShotCoreTests]
    dependencies:
      - target: MacShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower).coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacShot:
    build:
      targets:
        MacShot: all
        MacShotCoreTests: [test]
    test:
      targets:
        - MacShotCoreTests
    run:
      config: Debug
