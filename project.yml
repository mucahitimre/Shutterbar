name: MacShot

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

# İmza ve bundle id öneki Config/Signing.xcconfig'ten (+ gitignore'daki Config/Local.xcconfig) gelir.
# Two distribution channels: Debug / Release = GitHub (Developer ID, not sandboxed, automatic scrolling),
# AppStore = Mac App Store (sandboxed, manual scrolling only).
configs:
  Debug: debug
  Release: release
  AppStore: release

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
  AppStore: Config/Signing.xcconfig

settings:
  base:
    # Tek ad sabiti: ürün adı, bundle id ve kayıt klasörü buradan türetilir.
    APP_NAME: MacShot
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: 1.10.0

targets:
  MacShotCore:
    type: framework
    platform: macOS
    sources: [Sources/MacShotCore]
    settings:
      base:
        PRODUCT_NAME: MacShotCore
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower).core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  MacShot:
    type: application
    platform: macOS
    sources: [Sources/MacShot]
    dependencies:
      - target: MacShotCore
      - package: KeyboardShortcuts
    info:
      path: Sources/MacShot/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        # No custom cryptography; answers the App Store export compliance question.
        ITSAppUsesNonExemptEncryption: false
    settings:
      configs:
        AppStore:
          CODE_SIGN_ENTITLEMENTS: Sources/MacShot/MacShot-AppStore.entitlements
      base:
        CODE_SIGN_ENTITLEMENTS: Sources/MacShot/MacShot.entitlements
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  MacShotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/MacShotCoreTests]
    dependencies:
      - target: MacShotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).$(APP_NAME:lower).coretests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MacShot:
    build:
      targets:
        MacShot: all
        MacShotCoreTests: [test]
    test:
      targets:
        - MacShotCoreTests
    run:
      config: Debug
