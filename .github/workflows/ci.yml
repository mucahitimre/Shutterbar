name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # CI has no signing identity: build and test unsigned. Local builds sign via Config/Local.xcconfig.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project MacShot.xcodeproj -scheme MacShot \
            -configuration Debug -derivedDataPath build/DD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            test

      - name: No legacy capture API
        run: |
          if grep -rnE 'CGWindowListCreateImage|CGDisplayCreateImage' Sources Tests; then
            echo "Legacy capture API found; use ScreenCaptureKit." >&2
            exit 1
          fi
